<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Pedir Taxi</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --whatsapp: #25d366;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top {
      padding: 18px 16px 10px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .fields {
      padding: 0 16px 14px;
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin: 14px 0 8px;
    }

    .input-wrap {
      position: relative;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 16px;
      background: #fff;
      outline: none;
      color: var(--text);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      min-height: 52px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-location {
      background: var(--primary);
      color: #fff;
      margin-top: 14px;
    }

    .btn-submit {
      background: var(--whatsapp);
      color: #fff;
      margin-top: 14px;
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.25);
    }

    .helper {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 1200;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
      max-height: 240px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.35;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:active,
    .suggestion-item:hover {
      background: #f8fafc;
    }

    .map-section {
      padding: 0 16px 16px;
    }

    .status {
      margin: 12px 0 10px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
    }

    .status.info {
      color: var(--primary);
    }

    .status.ok {
      color: var(--success);
    }

    .status.warn {
      color: var(--warning);
    }

    .status.error {
      color: var(--danger);
    }

    .map-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #e5e7eb;
    }

    #map {
      width: 100%;
      height: 360px;
    }

    .center-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -100%);
      z-index: 900;
      pointer-events: none;
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.28));
    }

    .map-tip {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      white-space: nowrap;
      max-width: calc(100% - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary {
      margin-top: 12px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .summary strong {
      display: block;
      margin-bottom: 6px;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .footer-space {
      height: 4px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 0;
      }

      .card {
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
      }

      .top {
        padding: 18px 14px 10px;
      }

      .fields,
      .map-section {
        padding-left: 14px;
        padding-right: 14px;
      }

      .title {
        font-size: 26px;
      }

      #map {
        height: 390px;
      }

      .center-pin {
        font-size: 44px;
      }

      .btn {
        min-height: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="top">
        <h1 class="title">Pedir Taxi</h1>
        <div class="subtitle">
          Elige tu punto de recojo, escribe tu destino y solicita tu taxi por WhatsApp.
        </div>
      </div>

      <div class="fields">
        <button class="btn btn-location" id="btnUbicacion" type="button">
          📍 Usar mi ubicación actual
        </button>

        <label class="label" for="pickup">¿Dónde te recogemos?</label>
        <div class="input-wrap">
          <input
            id="pickup"
            type="text"
            placeholder="Ejemplo: Av. Angélica Gamarra 470"
            autocomplete="off"
          />
          <div id="pickupSuggestions" class="suggestions"></div>
        </div>
        <div class="helper">
          Escribe tu dirección o usa tu ubicación actual. Luego ajusta el mapa si hace falta.
        </div>

        <label class="label" for="destino">¿A dónde vas?</label>
        <div class="input-wrap">
          <input
            id="destino"
            type="text"
            placeholder="Ejemplo: Mega Plaza"
            autocomplete="off"
          />
          <div id="destinoSuggestions" class="suggestions"></div>
        </div>

        <label class="label" for="pago">Método de pago</label>
        <select id="pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Yape">Yape</option>
          <option value="Plin">Plin</option>
        </select>

        <label class="label" for="referencia">Referencia opcional</label>
        <input
          id="referencia"
          type="text"
          placeholder="Ejemplo: Frente a la farmacia"
          autocomplete="off"
        />
      </div>

      <div class="map-section">
        <div id="status" class="status info">
          📍 Ajusta el mapa hasta tu punto exacto de recojo.
        </div>

        <div class="map-wrap">
          <div id="map"></div>
          <div class="center-pin">📍</div>
          <div id="mapTip" class="map-tip">🎯 Mueve el mapa hasta tu punto exacto</div>
        </div>

        <div id="summary" class="summary">
          <strong>Resumen</strong>
          Esperando punto de recojo.
        </div>

        <button class="btn btn-submit" id="btnPedir" type="button">
          🚖 Pedir taxi ahora
        </button>

        <div class="footer-space"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DEFAULT_COORDS = [-12.0464, -77.0428];
    const WHATSAPP_NUMBER = "51999999999"; // CAMBIA ESTE NÚMERO

    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true
    }).setView(DEFAULT_COORDS, 13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const pickupInput = document.getElementById("pickup");
    const destinoInput = document.getElementById("destino");
    const referenciaInput = document.getElementById("referencia");
    const pagoSelect = document.getElementById("pago");
    const btnUbicacion = document.getElementById("btnUbicacion");
    const btnPedir = document.getElementById("btnPedir");
    const statusEl = document.getElementById("status");
    const summaryEl = document.getElementById("summary");
    const mapTipEl = document.getElementById("mapTip");
    const pickupSuggestions = document.getElementById("pickupSuggestions");
    const destinoSuggestions = document.getElementById("destinoSuggestions");

    let pickupConfirmed = false;
    let pickupSelected = false;
    let reverseGeocodeTimeout = null;
    let activeFetchController = null;

    function setStatus(text, type = "info") {
      statusEl.className = "status " + type;
      statusEl.textContent = text;
    }

    function setLoading(button, isLoading, textNormal, textLoading) {
      button.disabled = isLoading;
      button.classList.toggle("loading", isLoading);
      button.textContent = isLoading ? textLoading : textNormal;
    }

    function updateSummary(extraText = "") {
      const center = map.getCenter();
      const pickupText = pickupInput.value.trim() || "Sin definir";
      const destinoText = destinoInput.value.trim() || "Sin definir";
      const referenciaText = referenciaInput.value.trim() || "Sin referencia";
      const pagoText = pagoSelect.value || "Sin definir";

      summaryEl.innerHTML = `
        <strong>Resumen</strong>
        📍 Recojo: ${escapeHtml(pickupText)}<br>
        🏁 Destino: ${escapeHtml(destinoText)}<br>
        💳 Pago: ${escapeHtml(pagoText)}<br>
        📝 Referencia: ${escapeHtml(referenciaText)}<br>
        🌎 Punto exacto: ${center.lat.toFixed(6)}, ${center.lng.toFixed(6)}
        ${extraText ? "<br>" + escapeHtml(extraText) : ""}
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function hideSuggestions(box) {
      box.style.display = "none";
      box.innerHTML = "";
    }

    function showSuggestions(box) {
      box.style.display = "block";
    }

    async function searchPlaces(query) {
      if (activeFetchController) {
        activeFetchController.abort();
      }

      activeFetchController = new AbortController();

      const url =
        "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&q=" +
        encodeURIComponent(query);

      const response = await fetch(url, {
        signal: activeFetchController.signal,
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("No se pudo buscar la dirección.");
      }

      return await response.json();
    }

    async function reverseGeocode(lat, lng) {
      const url =
        "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lng);

      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("No se pudo obtener la dirección exacta.");
      }

      return await response.json();
    }

    function applyPlaceToPickup(place) {
      pickupInput.value = place.display_name || "";
      pickupSelected = true;
      pickupConfirmed = false;

      const lat = parseFloat(place.lat);
      const lon = parseFloat(place.lon);

      map.setView([lat, lon], 17, { animate: true });
      pickupSuggestions.innerHTML = "";
      hideSuggestions(pickupSuggestions);
      pickupInput.blur();

      setStatus("📍 Ajusta el mapa si necesitas mayor precisión.", "warn");
      updateSummary("Falta confirmar el punto exacto.");
      mapTipEl.style.display = "block";
    }

    function applyPlaceToDestino(place) {
      destinoInput.value = place.display_name || "";
      hideSuggestions(destinoSuggestions);
      destinoInput.blur();
      updateSummary();
    }

    function setupAutocomplete(input, box, onSelect) {
      let debounceTimer = null;

      input.addEventListener("input", () => {
        const value = input.value.trim();

        if (input === pickupInput) {
          pickupConfirmed = false;
          pickupSelected = false;
        }

        if (debounceTimer) clearTimeout(debounceTimer);

        if (value.length < 3) {
          hideSuggestions(box);
          updateSummary();
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const results = await searchPlaces(value);

            if (!Array.isArray(results) || results.length === 0) {
              box.innerHTML = '<div class="suggestion-item">No se encontraron resultados</div>';
              showSuggestions(box);
              return;
            }

            box.innerHTML = "";
            results.forEach((place) => {
              const item = document.createElement("div");
              item.className = "suggestion-item";
              item.textContent = place.display_name;

              item.addEventListener("click", () => {
                onSelect(place);
              });

              box.appendChild(item);
            });

            showSuggestions(box);
          } catch (error) {
            if (error.name === "AbortError") return;
            box.innerHTML = '<div class="suggestion-item">Error al buscar direcciones</div>';
            showSuggestions(box);
          }
        }, 350);
      });

      input.addEventListener("focus", () => {
        if (box.innerHTML.trim()) {
          showSuggestions(box);
        }
      });
    }

    setupAutocomplete(pickupInput, pickupSuggestions, applyPlaceToPickup);
    setupAutocomplete(destinoInput, destinoSuggestions, applyPlaceToDestino);

    document.addEventListener("click", (e) => {
      if (!pickupSuggestions.parentElement.contains(e.target)) {
        hideSuggestions(pickupSuggestions);
      }
      if (!destinoSuggestions.parentElement.contains(e.target)) {
        hideSuggestions(destinoSuggestions);
      }
    });

    btnUbicacion.addEventListener("click", () => {
      if (!navigator.geolocation) {
        setStatus("❌ Tu dispositivo no permite obtener ubicación.", "error");
        return;
      }

      setLoading(
        btnUbicacion,
        true,
        "📍 Usar mi ubicación actual",
        "Buscando ubicación..."
      );

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          map.setView([lat, lng], 18, { animate: true });
          pickupConfirmed = false;
          pickupSelected = true;
          mapTipEl.style.display = "block";
          setStatus("📍 Ubicación encontrada. Ajusta el mapa si hace falta.", "warn");
          updateSummary("Falta confirmar el punto exacto.");

          try {
            const result = await reverseGeocode(lat, lng);
            if (result && result.display_name) {
              pickupInput.value = result.display_name;
              updateSummary("Falta confirmar el punto exacto.");
            }
          } catch (err) {
            // sin bloquear la experiencia
          }

          setLoading(
            btnUbicacion,
            false,
            "📍 Usar mi ubicación actual",
            "Buscando ubicación..."
          );
        },
        (error) => {
          let msg = "❌ No se pudo obtener tu ubicación.";
          if (error.code === 1) msg = "❌ Debes permitir acceso a tu ubicación.";
          if (error.code === 2) msg = "❌ No se pudo detectar tu ubicación.";
          if (error.code === 3) msg = "❌ Se agotó el tiempo al buscar tu ubicación.";

          setStatus(msg, "error");
          setLoading(
            btnUbicacion,
            false,
            "📍 Usar mi ubicación actual",
            "Buscando ubicación..."
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 0
        }
      );
    });

    map.on("movestart", () => {
      if (pickupSelected || pickupInput.value.trim()) {
        pickupConfirmed = false;
        setStatus("📍 Ajustando punto de recojo...", "warn");
        updateSummary("Falta confirmar el punto exacto.");
      }
    });

    map.on("moveend", () => {
      if (!(pickupSelected || pickupInput.value.trim())) {
        return;
      }

      pickupConfirmed = true;
      setStatus("✔️ Punto de recojo confirmado", "ok");
      updateSummary("Ubicación confirmada.");
      mapTipEl.style.display = "none";

      if (reverseGeocodeTimeout) {
        clearTimeout(reverseGeocodeTimeout);
      }

      reverseGeocodeTimeout = setTimeout(async () => {
        const center = map.getCenter();
        try {
          const result = await reverseGeocode(center.lat, center.lng);
          if (result && result.display_name) {
            pickupInput.value = result.display_name;
            updateSummary("Ubicación confirmada.");
          }
        } catch (err) {
          // no interrumpir
        }
      }, 500);
    });

    [pickupInput, destinoInput, referenciaInput, pagoSelect].forEach((el) => {
      el.addEventListener("input", () => updateSummary());
      el.addEventListener("change", () => updateSummary());
    });

    btnPedir.addEventListener("click", () => {
      const pickup = pickupInput.value.trim();
      const destino = destinoInput.value.trim();
      const referencia = referenciaInput.value.trim();
      const pago = pagoSelect.value;
      const center = map.getCenter();

      if (!pickup) {
        setStatus("⚠️ Ingresa tu punto de recojo.", "error");
        pickupInput.focus();
        return;
      }

      if (!pickupConfirmed) {
        setStatus("⚠️ Confirma tu punto de recojo moviendo el mapa.", "error");
        return;
      }

      if (!destino) {
        setStatus("⚠️ Ingresa tu destino.", "error");
        destinoInput.focus();
        return;
      }

      const mensaje = [
        "Hola, quiero solicitar un taxi.",
        "",
        "📍 Recojo: " + pickup,
        "🌎 Ubicación exacta: https://www.google.com/maps?q=" + center.lat + "," + center.lng,
        "",
        "🏁 Destino: " + destino,
        "💳 Pago: " + pago,
        "📝 Referencia: " + (referencia || "Sin referencia")
      ].join("\n");

      const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(mensaje);

      window.open(url, "_blank");
    });

    updateSummary("Falta confirmar el punto exacto.");
  </script>
</body>
</html>
