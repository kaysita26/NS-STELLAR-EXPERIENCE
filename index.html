<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pedido con ubicación</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body { font-family: Arial; }
    #map { height: 400px; margin-top:10px; }
    .pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100%);
      font-size: 30px;
      pointer-events: none;
    }
    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      background: green;
      color: white;
      border: none;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h3>Haz tu pedido</h3>

<input type="text" id="direccion" placeholder="Escribe tu dirección" style="width:100%; padding:10px;">
<p id="estado">📍 Escribe tu dirección y ajusta el mapa</p>

<div id="map"></div>
<div class="pin">📍</div>

<button onclick="enviarPedido()">Enviar pedido por WhatsApp</button>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([-12.0464, -77.0428], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const estado = document.getElementById("estado");

  map.on("movestart", () => {
    estado.innerText = "📍 Ajustando ubicación...";
  });

  map.on("moveend", () => {
    estado.innerText = "✔️ Ubicación lista";
  });

  function enviarPedido() {
    const center = map.getCenter();
    const direccion = document.getElementById("direccion").value;

    const lat = center.lat.toFixed(6);
    const lng = center.lng.toFixed(6);

    const mensaje = `
Hola, quiero hacer un pedido:

📍 Dirección: ${direccion}
🌎 Ubicación: https://www.google.com/maps?q=${lat},${lng}

`.trim();

    const numero = "51999999999"; // <-- CAMBIA TU NÚMERO

    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank");
  }
</script>

</body>
</html>
